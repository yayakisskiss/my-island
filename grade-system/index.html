<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教學評量診斷與學習路徑系統</title>
<style>
:root{--ink:#1c2340;--muted:#6a7090;--line:#e3e6f0;--bg:#f3f5fa;--card:#fff;--brand:#26337d;--brand2:#3d4fb8;--up:#16865a;--down:#c43a3a;--accent:#e2a32c}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--brand);color:#fff;padding:14px 18px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:19px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .sub{font-size:12.5px;opacity:.85}
.top select{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:3px 8px;font-size:14px}
.top select option{color:#1c2340}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:9px;font-size:14px;line-height:1.3}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.green{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.btn.dark{background:#2b3046;border-color:#2b3046;color:#fff}
.btn.warn{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.purple{background:#5a35a8;border-color:#5a35a8;color:#fff}
.btn.danger{color:var(--down);border-color:#f0c4c4;background:#fff6f6}
.btn.ghost-w{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.btn.sm{padding:3px 10px;font-size:13px}
nav.tabs{background:var(--brand);display:flex;overflow-x:auto;gap:4px;padding:0 10px 10px;position:sticky;top:0;z-index:5}
nav.tabs button{flex:0 0 auto;background:transparent;border:0;color:#d7dcf5;padding:9px 14px;border-radius:10px;font-size:14.5px;white-space:nowrap}
nav.tabs button.on{background:var(--brand2);color:#fff;font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;margin-left:5px;text-align:center}
main{max-width:1200px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:16.5px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.inp{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.3}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.kpi .d{font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.t th{background:#f1f3fa;text-align:center;padding:9px 8px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
.t td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.t td.l,.t th.l{text-align:left}
.t td.note{font-size:13px;color:#454b66;min-width:180px;text-align:left}
.t tr:last-child td{border-bottom:0}
.t input.sc{width:60px;padding:5px;border:1px solid var(--line);border-radius:7px;text-align:center}
.t input.sc:focus,.t .cell:focus{outline:2px solid var(--brand2);border-color:transparent}
.t .cell{padding:4px 5px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.t.items td{padding:5px 4px}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#f8f9fd}
.t tr.cur td{background:#f3f5ff}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid}
.subtabs{display:flex;gap:8px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:13.5px}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.acc{display:inline-block;background:#eef0fb;color:#3d4fb8;border-radius:6px;padding:1px 7px;font-size:12px;margin:2px}
.medal{font-size:12px;background:#fdf3e2;color:#a8650c;border-radius:6px;padding:1px 6px;margin-left:4px}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.modal.wide{max-width:920px}
.modal h3{margin:0 0 12px}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);justify-content:center;margin:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.banner{background:#fff7e6;border:1px solid #f3d9a4;color:#7a5410;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.meter{height:8px;background:#e8eaf2;border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--brand2)}
.lv{font-weight:700;white-space:nowrap}.lv.bad{color:#c43a3a}.lv.mid{color:#b7791f}.lv.ok{color:#2f8f5b}
/* 學習扶助歷程 */
.stepper{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
.stepper button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13.5px}
.stepper button.on{background:var(--brand2);color:#fff;border-color:var(--brand2);font-weight:600}
.stepper button.done:not(.on)::after{content:' ✓';color:#2f8f5b;font-weight:700}
.stepper .arr{color:#aab0c8}
.rwrap{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.rgrid{border-collapse:separate;border-spacing:0;font-size:12.5px}
.rgrid th,.rgrid td{border-bottom:1px solid var(--line);border-right:1px solid #eef0f6;padding:2px 1px;text-align:center;background:#fff;white-space:nowrap}
.rgrid thead th{background:#f1f3fa;position:sticky;top:0;z-index:2;font-weight:600;font-size:11.5px;padding:4px 2px}
.rgrid .rk{font-size:10px;color:var(--muted);font-weight:400}
.rgrid .stk{position:sticky;left:0;z-index:3;min-width:38px}
.rgrid .stk2{position:sticky;left:38px;z-index:3;min-width:70px;text-align:left;padding-left:6px;box-shadow:2px 0 0 #e3e6f0}
.rgrid thead .stk,.rgrid thead .stk2{z-index:5}
.rgrid .secstart{border-left:2px solid #b9c0dc}
.rgrid input.rc{width:30px;height:26px;border:1px solid transparent;border-radius:4px;text-align:center;font:inherit;background:transparent;padding:0}
.rgrid input.rc:focus{outline:2px solid var(--brand2);background:#fff}
.rgrid input.c-ok{color:#2f8f5b}.rgrid input.c-bad{background:#fde3e3;color:#a32020;font-weight:700}.rgrid input.c-part{background:#fff1cc;color:#8a5a00;font-weight:700}
.rgrid input.c-mis{box-shadow:inset 0 -3px 0 #c43a3a}
.rgrid td.rt{min-width:48px;position:sticky;right:0;background:#f8f9fd}
.doc .pg{page-break-before:always;break-before:page;margin-top:30px;border-top:1px dashed #999;padding-top:24px}
.doc ol{margin:4px 0;padding-left:22px}.doc ol li{margin:3px 0}
.doc .tipbox{border:1.5px solid #3b67b0;border-radius:8px;padding:8px 10px;margin:8px 0;background:#f3f6fc}
.doc .ws{margin:10px 0;page-break-inside:avoid}.doc .wsline{border-bottom:1px dotted #777;height:28px}

/* v4 教學循環 */
.ctx{padding:12px 16px}
.cycle{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cycle .cy{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;display:flex;flex-direction:column;align-items:flex-start;font-size:13.5px;line-height:1.3}
.cycle .cy small{font-size:11px;color:var(--muted)}
.cycle .cy.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}.cycle .cy.on small{color:#dfe3ff}
.cycle .cy.done span::after{content:' ✓';color:#2f8f5b;font-weight:700}.cycle .cy.on.done span::after{color:#bff3d6}
.cycle .arr,.rounds .arr{color:#aab0c8}
.nextstep{margin-left:auto;font-size:13.5px;background:#fff7e6;border:1px solid #f3d9a4;border-radius:9px;padding:5px 10px}
.nextstep a{color:#7a5410;font-weight:700;text-decoration:none}
a[data-act]{color:var(--brand2);text-decoration:none}
.heat td{padding:5px 4px;font-size:12.5px}.heat th .vh{writing-mode:vertical-rl;max-height:120px;font-size:12px;margin:auto}
.hm{display:inline-block;padding:0 6px;border-radius:4px;font-size:12px}
.tierbox{border:1.5px solid;border-radius:12px;padding:12px}
.chip{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;font-size:13px;color:var(--ink)!important}
.path{position:relative;margin-left:4px}
.node{display:flex;gap:10px;align-items:flex-start;padding:8px 0 12px;position:relative}
.node:not(:last-child)::before{content:'';position:absolute;left:14px;top:34px;bottom:-4px;width:2px;background:#dfe3f0}
.node .dot{flex:0 0 30px;height:30px;border-radius:50%;background:#eef0f8;color:#3d4fb8;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #c9cfe6;z-index:1}
.node.done .dot{background:#2f8f5b;color:#fff;border-color:#2f8f5b}.node.doing .dot{background:#fff3d6;border-color:#e2a32c;color:#a8650c}
.node .nb{flex:1;font-size:13.5px}.node .nt{margin-bottom:2px}.node .ntype{font-size:12px;background:#eef0fb;color:#3d4fb8;border-radius:6px;padding:1px 6px}
.node .nsub{font-size:12.5px;color:#555b78;margin-top:3px}
.node.done .nb{opacity:.75}
.stbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:12.5px;white-space:nowrap}
.node.done .stbtn{color:#2f8f5b;font-weight:700}.node.doing .stbtn{color:#a8650c;font-weight:700}
.stbtn:disabled{cursor:default;opacity:.8}
.rounds{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.rbadge{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:#f7f8fc}.rbadge.on{border-color:#e2a32c;background:#fff7e6}
.pbar2{display:inline-block;height:8px;background:#6a86e0;border-radius:3px;vertical-align:0}

/* v5 作答登錄 */
.iteminfo{background:#f6f7fc;border-radius:10px;padding:10px 12px;font-size:14px}
.rub{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13px;color:#454b66}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.stile{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.stile.bad{border-color:#e7a4a4;background:#fff6f6}.stile.part{border-color:#ecc56b;background:#fffaf0}.stile.ok{border-color:#9fd8b8}
.sth{font-size:14px;display:flex;gap:6px;align-items:center}.sts{margin-left:auto;font-size:12.5px;font-weight:700;color:#a32020}.stile.ok .sts{color:#2f8f5b}
.sraw{font-size:13px;color:#2b3046;background:#f1f3fa;border-radius:6px;padding:3px 6px;margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ob{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:13px;min-width:30px}
.ob.key{border-color:#2f8f5b;color:#2f8f5b;font-weight:700}.ob.on{background:#c43a3a;border-color:#c43a3a;color:#fff}.ob.key.on,.ob.okb.on{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.ob.sc.on{background:#e2a32c;border-color:#e2a32c}.ob.cd{color:#5a35a8;border-color:#cbb8ee}.ob.cd.on{background:#5a35a8;color:#fff}
.qchip{display:inline-block;background:#fde3e3;color:#a32020;border-radius:6px;padding:1px 7px;margin:2px;font-size:12.5px}.qchip.part{background:#fff1cc;color:#8a5a00}
.pitem{border-top:1px solid var(--line);padding:12px 0}.pgroup{padding:8px 0 4px;border-bottom:1px dashed var(--line)}.pans{font-size:15px}
/* 列印文件 */
.docwrap{background:#e3e6ee;border-radius:12px;padding:16px;overflow-x:auto}
.doc{background:#fff;width:780px;margin:0 auto;padding:30px 32px;color:#000;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.doc h1{text-align:center;font-size:20px;margin:0}
.doc h2{text-align:center;font-size:15.5px;margin:4px 0 10px}
.doc h3{font-size:14.5px;border-bottom:1.5px solid #000;padding-bottom:3px;margin:18px 0 8px;page-break-after:avoid;break-after:avoid}
.doc h4{font-size:13px;margin:10px 0 5px;page-break-after:avoid;break-after:avoid}
.doc .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
.doc table{border-collapse:collapse;width:100%}
.doc th,.doc td{border:1px solid #444;padding:4px 5px;text-align:center}
.doc th{background:#eef0f5}
.doc td.l,.doc th.l{text-align:left}
.doc thead{display:table-header-group}
.doc tr{page-break-inside:avoid;break-inside:avoid}
.doc .seal{margin-top:16px;page-break-inside:avoid;break-inside:avoid}
.doc .seal td{height:70px;vertical-align:top;font-weight:600}
.doc .note{font-size:11.5px}
.doc .sp{color:#5a35a8;font-size:11px}
.doc .foot{margin-top:8px;font-size:11px;color:#444}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.doc .pbar{display:inline-block;height:9px;background:#3b67b0;vertical-align:-1px;margin-right:5px}
.doc .info td:nth-child(odd){background:#f4f5f8;font-weight:700;width:15%;text-align:left}
.doc .info td:nth-child(even){text-align:left}
.doc .twc td{vertical-align:top;font-size:10.5px}
.doc ul{margin:4px 0;padding-left:20px}.doc li{margin:2px 0}
.doc p{margin:4px 0}
.doc .signs{display:flex;gap:14px;margin-top:30px;page-break-inside:avoid}.doc .signs div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}
.doc .keep{page-break-inside:avoid;break-inside:avoid}
.notice + .notice{margin-top:26px;border-top:1px dashed #999;padding-top:26px}
.notice{page-break-after:always;break-after:page}
.notice:last-child{page-break-after:auto;break-after:auto}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff}
  .no-print{display:none !important}
  main{padding:0;max-width:none}
  .docwrap{background:none;padding:0;overflow:visible;border-radius:0}
  .doc{width:auto;padding:0;font-size:10.5pt;box-shadow:none}
  .notice + .notice{border-top:0;margin-top:0;padding-top:0}
  .doc .pg{border-top:0;margin-top:0;padding-top:0}
  .doc,.doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top no-print">
  <div>
    <h1><span id="hSchool"></span><select id="classSel" title="切換班級"></select></h1>
    <div class="sub" id="hSub"></div>
  </div>
  <div class="top-actions">
    <button class="btn ghost-w" data-act="snapmodal">📌 存成歷程紀錄</button>
    <button class="btn ghost-w" data-act="backup">⬇ 完整備份</button>
    <button class="btn warn" data-act="tab" data-tab="print">🖨 列印</button>
  </div>
</header>
<nav class="tabs no-print" id="tabs"></nav>
<main>
  <section class="panel" id="p-home"></section>
  <section class="panel" id="p-lib"></section>
  <section class="panel" id="p-design"></section>
  <section class="panel" id="p-resp"></section>
  <section class="panel" id="p-diag"></section>
  <section class="panel" id="p-remed"></section>
  <section class="panel" id="p-student"></section>
  <section class="panel no-print" id="p-examnav"></section>
  <section class="panel" id="p-entry"></section>
  <section class="panel" id="p-compare"></section>
  <section class="panel" id="p-special"></section>
  <section class="panel" id="p-quality"></section>
  <section class="panel" id="p-paper"></section>
  <section class="panel" id="p-print"></section>
  <section class="panel" id="p-admin"></section>
</main>
<div class="modal-bg no-print" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast no-print" id="toast"></div>
<input type="file" id="fileCsv" accept=".csv,.txt" hidden>
<input type="file" id="fileJson" accept=".json" hidden>
<input type="file" id="filePaper" accept=".csv,.txt" hidden>

<script>
/* ================= 常數與工具 ================= */
const TYPES={'一般':['#6a7090','#f3f4f8'],'資賦優異':['#1f7a4a','#e7f6ee'],'資源班':['#7a3bb0','#f3eafb'],'學習扶助':['#a8650c','#fdf3e2'],'特教生(IEP)':['#3d4fb8','#eceffd'],'身障考場調整':['#a83560','#fbe9f0']};
const EXEMPT_DEFAULT=['資源班','特教生(IEP)','身障考場調整'];
const EXAMS={s1:'第一次段考',s2:'第二次段考'};
const COG=['記憶','了解','應用','分析','評鑑','創造'];
const KNOW=['事實','概念','程序','後設認知'];
const DIFF=['易','中','難'];
const QTYPES=['選擇題','是非題','填充題','計算題','應用題','作圖題','配合題','簡答題','閱讀測驗','寫作'];
const FMTS={analysis:'班級兩次段考成長對比分析冊',roster:'班級正式成績冊',notice:'個人成績通知單',paper:'試卷分析報告',diag:'學生作答與迷失概念診斷報告',stud:'學生個別學習診斷單',remed:'補救教學教案與學習單',track:'學習扶助補救歷程紀錄表'};
const PAPER_FMTS=['paper','diag','stud','remed','track'];
const KEY='gradeTracker.v2',OLDKEY='gradeTracker.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=x=>Math.round(x*10)/10;
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
const fmt=x=>x==null||isNaN(x)?'—':String(r1(x));
const sgn=x=>x==null||isNaN(x)?'—':(x>0?'+':'')+fmt(x);
const cls=x=>x==null||isNaN(x)?'flat':x>0?'up':x<0?'down':'flat';
const mean=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:null;

function migrate(o){
  if(o&&o.ver===2&&Array.isArray(o.classes))return o;
  if(o&&Array.isArray(o.students)){ // 第一版資料
    const st=o.settings||{},d=freshDB();
    const c={id:uid(),name:st.klass||'班級',teacher:st.teacher||'',year:st.year||'',term:'上',subjects:st.subjects||[],students:o.students};
    Object.assign(d.settings,{school:st.school||d.settings.school,passLine:st.passLine||60});if(st.seals)d.settings.seals=st.seals;
    d.classes=[c];d.cur=c.id;return d;
  }
  throw new Error('不是本系統的資料檔');
}

function snapshot(kind,label,quiet){
  const obj=kind==='score'?C():P();if(!obj)return false;
  const data=clone(obj),last=DB.history.find(h=>h.kind===kind&&h.ref===obj.id);
  if(quiet&&last&&JSON.stringify(last.data)===JSON.stringify(data))return false;
  DB.history.unshift({id:uid(),time:new Date().toISOString(),kind,ref:obj.id,refName:kind==='score'?obj.name:obj.title,label:label||'手動存檔',data});
  if(DB.history.length>300)DB.history.length=300;
  save();return true;
}
function histSummary(h){
  if(h.kind==='score'){const A=analyze(h.data),b=A.filter(o=>o.diff!=null);return `${h.data.students.length} 人｜一段 ${fmt(mean(b.map(o=>o.a1)))}｜二段 ${fmt(mean(b.map(o=>o.a2)))}`}
  const s=h.data.items.reduce((a,b)=>a+(num(b.score)||0),0);return `${h.data.items.length} 題｜配分 ${s}／${h.data.total}`;
}

function nextMisCode(p){let n=0;p.miscons.forEach(m=>{const k=+((String(m.code).match(/\d+/)||[0])[0]);if(k>n)n=k});return 'M'+(n+1)}

  p.miscons.forEach(m=>{m.steps=m.steps||[];m.practice=m.practice||[];m.check=m.check||[];['desc','cause','strategy','concept','name'].forEach(k=>m[k]=m[k]||'')});
  p.items.forEach(it=>{if(it.concept==null)it.concept='';if(it.key==null)it.key='';if(!it.mis||typeof it.mis!=='object')it.mis={}});return p}
function respOf(p,c){p.resp[c.id]=p.resp[c.id]||{blankOk:true,data:{},absent:{}};const R=p.resp[c.id];R.data=R.data||{};R.absent=R.absent||{};if(R.blankOk==null)R.blankOk=true;return R}
function remedOf(p,c,mid){p.remed[c.id]=p.remed[c.id]||{};const r=p.remed[c.id];if(mid){r[mid]=r[mid]||{date:'',note:'',st:{}};r[mid].st=r[mid].st||{};return r[mid]}return r}

function demoResp(p,c){

  const ids=p.miscons.map(m=>m.id),R={blankOk:true,data:{},absent:{}},pick=a=>a[Math.floor(rnd()*a.length)];
  sortedS(c).forEach(s=>{
    const ab=(num(s.s1['數學'])??70)/100,k=ab<.6?3:ab<.75?2:ab<.9?1:0,prof=new Set();while(prof.size<k)prof.add(pick(ids));
    const row={};
    p.items.forEach(it=>{
      const codes=Object.entries(it.mis),hit=codes.filter(([,mid])=>prof.has(mid));
      let pc=Math.min(.98,ab+(it.diff==='易'?.2:it.diff==='難'?-.12:.08));if(hit.length)pc*=.3;
      if(rnd()<pc)return;
      const full=num(it.score)||1;
      if(it.key){const free=['A','B','C','D'].filter(x=>x!==it.key&&!it.mis[x]);row[it.id]=hit.length?pick(hit)[0]:(free.length&&rnd()<.85?pick(free):pick(['A','B','C','D'].filter(x=>x!==it.key)));return}
      const code=hit.length?pick(hit)[0]:(codes.length&&rnd()<.08?pick(codes)[0]:'');
      row[it.id]=full>=2&&rnd()<.4?String(Math.floor(rnd()*(full-1))+1)+code:(code||'x');
    });

  });
  p.resp[c.id]=R;
  const D=diagnose(p,c);D.MS.filter(g=>g.per.length).slice(0,2).forEach((g,gi)=>{const r=remedOf(p,c,g.m.id);r.date=gi?'115/11/20':'115/11/13';r.note='晨光時間小組補救 2 節';g.per.forEach((x,i)=>{r.st[x.s.id]=i%3===2?'再加強':'通過'})});
}

function evalCell(it,v,blankOk){
  const full=num(it.score)||0;v=String(v??'').trim();
  if(v==='')return blankOk?{s:full,ok:true}:{s:0,ok:false,blank:true};
  const low=v.toLowerCase();
  if(low==='o'||low==='v'||v==='✓')return{s:full,ok:true,opt:it.key?it.key.toUpperCase():null};
  if(it.key){const L=v.toUpperCase();if(L===it.key.toUpperCase())return{s:full,ok:true,opt:L};return{s:0,ok:false,opt:L,mis:it.mis[L]||null,code:L}}
  if(low==='x')return{s:0,ok:false};
  const m=low.match(/^(\d+(?:\.\d+)?)?([a-h])?$/);if(!m)return{s:0,ok:false,bad:true};
  const s=m[1]!=null?Math.min(full,+m[1]):0,code=m[2]||null;
  return{s,ok:s>=full&&!code,partial:s>0&&s<full,mis:code?(it.mis[code]||null):null,code};
}
function diagnose(p,c){

  const entered=Object.keys(R.data).length>0;

  const E={};studs.forEach(s=>{const row=R.data[s.id]||{};E[s.id]=items.map(it=>evalCell(it,row[it.id],R.blankOk))});
  const ST=studs.map(s=>{const sc=r1(E[s.id].reduce((a,e)=>a+e.s,0));return{s,score:sc,rate:tot?sc/tot*100:0}});

}

function aiPrompt(p,m){

${its?'相關試題：'+its+'\n':''}

function parseAI(t){
  const out={},re=/【([^】]+)】/g,parts=[];let m,last=null,idx=0;
  while((m=re.exec(t))){if(last!=null)parts.push([last,t.slice(idx,m.index)]);last=m[1];idx=re.lastIndex}
  if(last!=null)parts.push([last,t.slice(idx)]);
  const lines=s=>s.split('\n').map(x=>x.replace(/^\s*(?:[-•．・*]\s*|\d+\s*[.、．)）]\s*|[（(]\d+[）)]\s*|步驟\s*[一二三四五六七八九\d]+\s*[:：、.]?\s*|第\s*[一二三四五六七八九\d]+\s*[步題]\s*[:：、.]?\s*)/,'').trim()).filter(Boolean);
  parts.forEach(([h,b])=>{if(/成因|原因/.test(h))out.cause=b.trim();else if(/策略/.test(h))out.strategy=b.trim();else if(/步驟/.test(h))out.steps=lines(b);else if(/練習/.test(h))out.practice=lines(b);else if(/後測|檢核/.test(h))out.check=lines(b);else if(/表現|錯誤/.test(h))out.desc=b.trim()});
  return out;
}

/* ================= 成績計算（傳入班級物件） ================= */
function avgOf(st,ex,c){const v=c.subjects.map(k=>num(st[ex][k])).filter(x=>x!=null);return v.length?mean(v):null}
function totalOf(st,ex,c){const v=c.subjects.map(k=>num(st[ex][k])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null}
function sortedS(c){return [...c.students].sort((a,b)=>a.seat-b.seat)}
function ranks(ex,c){
  const el=c.students.filter(s=>!s.exempt).map(s=>({id:s.id,a:avgOf(s,ex,c)})).filter(o=>o.a!=null).map(o=>({...o,a:r1(o.a)})).sort((a,b)=>b.a-a.a);
  const m={};el.forEach((o,i)=>{m[o.id]=(i>0&&o.a===el[i-1].a)?m[el[i-1].id]:i+1});return m;
}
function subjDiffs(s,c){return c.subjects.map(k=>{const a=num(s.s1[k]),b=num(s.s2[k]);return{k,d:a!=null&&b!=null?b-a:null}}).filter(o=>o.d!=null)}
function autoNote(s,diff,c){
  if(diff==null)return '尚缺段考成績';
  const ds=subjDiffs(s,c).sort((a,b)=>b.d-a.d),best=ds[0],worst=ds[ds.length-1];
  if(diff>=7)return `進步顯著，${best.k}科進步 ${best.d} 分，值得表揚`;
  if(diff>=3)return `穩定成長，${best.k}科進步最多（+${best.d}）`;
  if(diff>-1)return `表現持平${worst&&worst.d<0?`，${worst.k}科略降 ${-worst.d} 分`:''}`;
  return `成績微幅下滑，${worst.k}科退步 ${-worst.d} 分，建議維持平日複習節奏`;
}
function analyze(c){
  c=c||C();const R1=ranks('s1',c),R2=ranks('s2',c);
  return sortedS(c).map(s=>{
    let a1=avgOf(s,'s1',c),a2=avgOf(s,'s2',c);a1=a1==null?null:r1(a1);a2=a2==null?null:r1(a2);
    const diff=a1!=null&&a2!=null?r1(a2-a1):null,rate=diff!=null&&a1?diff/a1*100:null;
    const k1=s.exempt?'免列':(R1[s.id]??'—'),k2=s.exempt?'免列':(R2[s.id]??'—');
    const rc=typeof k1==='number'&&typeof k2==='number'?k1-k2:null;
    return {s,a1,a2,diff,rate,k1,k2,rc,note:s.note||autoNote(s,diff,c)};
  });
}
function isSpecial(s){return s.type!=='一般'||s.exempt}
function pct(arr,p){const a=[...arr].sort((x,y)=>x-y);if(!a.length)return null;const i=(a.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo)}
function rcHtml(o){
  if(o.s.exempt)return '<span class="flat">免列</span>';
  if(o.rc==null||o.rc===0)return '<span class="flat">— 持平</span>';
  return o.rc>0?`<span class="up">↑ ${o.rc}</span>`:`<span class="down">↓ ${-o.rc}</span>`;
}
function tag(t){const c=TYPES[t]||TYPES['一般'];return `<span class="tag" style="color:${c[0]};background:${c[1]};border-color:${c[0]}33">${esc(t)}</span>`}
function mask(n){n=String(n);return n.length>=3?n[0]+'○'+n.slice(2):n.length===2?n[0]+'○':n}

/* ================= 試卷分析引擎 ================= */
function analyzePaper(p){
  const it=p.items,sc=x=>num(x.score)||0,sum=r1(it.reduce((a,b)=>a+sc(b),0)),n=it.length,total=num(p.total)||0;
  const pc=s=>sum?Math.round(s/sum*100):0;
  const units=[...p.units];it.forEach(x=>{if(x.unit&&!units.includes(x.unit))units.push(x.unit)});
  const agg=(key,cats)=>cats.map(c=>{const g=it.filter(x=>x[key]===c),s=r1(g.reduce((a,b)=>a+sc(b),0));return{c,n:g.length,s,p:pc(s),g}});
  const types=QTYPES.filter(t=>it.some(x=>x.type===t)).concat([...new Set(it.map(x=>x.type).filter(t=>t&&!QTYPES.includes(t)))]);
  const T=agg('type',types),G=agg('cog',COG),D=agg('diff',DIFF),U=agg('unit',units);
  const secName=x=>x.sec||'（未分大題）';
  const SEC=[...new Set(it.map(secName))].map(s=>{const g=it.filter(x=>secName(x)===s),v=r1(g.reduce((a,b)=>a+sc(b),0));return{s,g,n:g.length,sc:v,p:pc(v),type:[...new Set(g.map(x=>x.type).filter(Boolean))].join('、')}});
  const lit=it.filter(x=>x.lit),litS=r1(lit.reduce((a,b)=>a+sc(b),0)),litP=pc(litS);
  const gp=c=>G.find(x=>x.c===c).p,memU=gp('記憶')+gp('了解'),app=gp('應用'),hi=gp('分析')+gp('評鑑')+gp('創造');
  const dp=c=>D.find(x=>x.c===c).p,e=dp('易'),m=dp('中'),h=dp('難');
  const K=[],pros=[],cons=[],adv=[],teach=[],add=(lv,item,desc)=>K.push({lv,item,desc});
  // 1 單元
  const miss=U.filter(x=>x.n===0).map(x=>x.c);
  if(miss.length){add('需修正','有單元未命題',`${miss.join('、')} 沒有任何題目。`);cons.push(`${miss.join('、')}完全未命題，導致課程覆蓋不全`);adv.push('補全缺漏單元');teach.push(`教學應加強${miss.join('、')}內容的複習與延伸，確保課程覆蓋完整`)}
  else if(units.length)add('良好','各單元皆有命題',`${units.length} 個單元皆有題目。`);
  // 2 資料完整
  const bad=it.filter(x=>!(sc(x)>0)||!x.unit||!x.cog||!x.diff||!x.type);
  if(bad.length)add('需修正','題目資料不完整',`${bad.slice(0,6).map(x=>x.no||'（無題號）').join('、')}${bad.length>6?` 等 ${bad.length} 題`:''} 缺少配分、題型、單元、認知或難度。`);
  // 3 配分
  if(total&&sum===total){add('良好','配分合計正確',`各題配分合計 ${sum} 分，與試卷總分 ${total} 分相符。`);pros.push(`試卷配分合計精確符合總分 ${total} 分標準`)}
  else{add('需修正','配分合計不符',`各題配分合計 ${sum} 分，試卷總分為 ${total} 分（相差 ${r1(total-sum)} 分）。`);cons.push('各題配分合計與試卷總分不符');adv.push('核對各題配分')}
  // 4 認知層次缺漏
  const absent=G.filter(x=>x.n===0).map(x=>x.c);
  if(absent.length){add('注意','部分認知層次未出現',`未出現：${absent.join('、')}。國小試卷不一定每層都要有，可視科目性質決定。`);cons.push(`認知層次中「${absent.join('」、「')}」完全缺失，思維層次較單一`)}
  // 5 難度
  const ref=[30,50,20],cur=[e,m,h],dev=cur.map((v,i)=>v-ref[i]);
  if(Math.max(...dev.map(Math.abs))>15){
    const nt=[];DIFF.forEach((d,i)=>{if(dev[i]>10)nt.push(`「${d}」偏多`);else if(dev[i]<-10)nt.push(`「${d}」偏少`)});
    add('注意','難度比例偏離參考值',`目前 易:中:難 ＝ ${e}:${m}:${h}（%），參考值 30:50:20。${nt.join('、')}。`);
    cons.push(`試卷難度分布偏離參考值${h===0?'，「難」度題目為零，缺乏挑戰性':dev[2]>10?'，「難」度題目偏多，可能影響基礎學生信心':''}`);adv.push('調整難易度');
    teach.push(dev[2]<-10?'課堂設計需增加高難度挑戰題，鼓勵學生進行深度分析與創造性思考':dev[0]<-10?'加強基礎概念與基本題型練習，穩固學習基礎':'依學生程度調整練習題的難度分布');
  }else{add('良好','難度比例適中',`易:中:難 ＝ ${e}:${m}:${h}（%），接近參考值 30:50:20。`);pros.push('難易度分布接近參考比例，具鑑別度')}
  // 6 認知比例
  const cogTxt=`記憶＋了解 ${memU}%、應用 ${app}%、分析以上 ${hi}%。`;
  if(memU>50){add('注意','記憶理解比重偏高',cogTxt);cons.push(`記憶與了解層次占 ${memU}%，高層次思考題偏少`);adv.push('增加應用與分析層次題目');teach.push('多設計生活情境的應用與分析任務，引導學生由記憶走向理解與運用')}
  else if(hi<15){add('注意','高層次思考比例偏低',cogTxt);cons.push(`分析以上層次僅占 ${hi}%`);adv.push('增加分析與評鑑層次題目');teach.push('課堂提問可增加比較、推論與評鑑類問題')}
  else{add('良好','認知層次比例適中',cogTxt);pros.push('認知歷程中分析與應用層次占比適中，符合高階思維培養')}
  // 7 題型
  if(types.length>=3){add('良好','題型多元',`共 ${types.length} 種題型：${types.join('、')}。`);pros.push(`題型涵蓋${types.join('、')}${types.length}種，形式多元`)}
  else{add('注意','題型較單一',`僅 ${types.length} 種題型：${types.join('、')||'—'}。`);cons.push('題型種類較少');adv.push('增加題型變化')}
  // 8 素養

  else{add('注意','素養導向題比例偏低',`情境化題目 ${lit.length} 題、${litS} 分（${litP}%），建議至少 30%。`);cons.push(`素養導向題目僅占 ${litP}%`);adv.push('增加生活情境題');teach.push('教學中多連結生活情境，培養學生解決真實問題的能力')}
  // 9 單元集中
  const top=[...U].sort((a,b)=>b.p-a.p)[0];
  if(units.length>=2&&top&&top.p>=70){add('注意','單元配分過度集中',`${top.c} 占 ${top.p}%，其他單元比重偏低。`);cons.push(`${top.c}占比過高（${top.p}%），其他單元內容失衡`);teach.push(`未來命題時應均衡分配各單元比重，避免過度集中於${top.c}`)}
  const order={'需修正':0,'注意':1,'良好':2};K.sort((a,b)=>order[a.lv]-order[b.lv]);
  // 整體評語
  const good=[];if(total&&sum===total)good.push('配分正確');if(types.length>=3)good.push('題型多元');if(litP>=30)good.push('素養導向比例充足');if(memU<=50&&hi>=15)good.push('涵蓋大部分認知層次');
  const overall=`本試卷${good.length?good.join('、')+'，':''}${cons.length?`主要問題在於${cons.slice(0,2).join('；')}。建議${[...new Set(adv)].join('並')||'檢視上列項目'}，以平衡學生學習成果評估。`:'整體結構完整均衡，可作為後續命題參考。'}`;
  // 修題建議

    if(h<10&&allEasy&&tp==='計算題')fx.push(`【${rng(g)}】將部分簡單計算題改為需多步驟解決的應用題，提升難度與分析能力。`);
    else if(h<10&&tp==='應用題'&&!g.some(i=>i.diff==='難'))fx.push(`【${rng(g)}】保留現有題目但增加情境複雜度，或調整數值範圍，設計 1–2 題「難」度題以增加挑戰性。`);
    else if(tp==='選擇題'&&g.length>=10)fx.push(`【${rng(g)}】選擇題數量較多，可將部分題目改為填充題或作圖題，並加入需要推論的選項設計。`);
    else if(g.length>=3&&memN/g.length>=.6)fx.push(`【${rng(g)}】此大題以記憶型題目為主，可改寫部分題目為情境應用題，提高思考層次。`);
  });

  // 素養評估

function chartSVG(A){
  const B=[['90-100（優異）',90,1e9],['80-89（良好）',80,90],['70-79（中等）',70,80],['60-69（及格）',60,70],['59以下（待加強）',-1e9,60]];
  const c1=B.map(b=>A.filter(o=>o.a1!=null&&o.a1>=b[1]&&o.a1<b[2]).length),c2=B.map(b=>A.filter(o=>o.a2!=null&&o.a2>=b[1]&&o.a2<b[2]).length);
  const mx=Math.max(1,...c1,...c2),W=680,H=270,pl=34,pb=40,pt=16,cw=(W-pl-10)/5,y=v=>pt+(H-pt-pb)*(1-v/mx),step=mx>10?2:1;
  let g='';for(let v=0;v<=mx;v+=step)g+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e8f0"/><text x="${pl-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#6a7090">${v}</text>`;
  const bw=cw*.3;
  B.forEach((b,i)=>{const x1=pl+i*cw+cw*.18,x2=x1+bw+5;
    [[x1,c1[i],'#8aa0ee'],[x2,c2[i],'#4caf82']].forEach(([x,c,col])=>{g+=`<rect x="${x}" y="${y(c)}" width="${bw}" height="${y(0)-y(c)}" rx="3" fill="${col}"/><text x="${x+bw/2}" y="${y(c)-5}" font-size="12" text-anchor="middle" fill="#1c2340">${c}</text>`});
    g+=`<text x="${pl+i*cw+cw/2}" y="${H-14}" font-size="12" text-anchor="middle" fill="#454b66">${b[0]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:780px;display:block;margin:0 auto;min-width:520px;height:auto">${g}</svg>`;
}

  <h3>五、後續追蹤建議</h3><ul>${(()=>{const L=[];const again=[];groups.forEach(g=>{const r=remedOf(p,c,g.m.id);g.per.forEach(x=>{if(r.st[x.s.id]==='再加強')again.push(`${x.s.name}（${g.m.name}）`)})});

const PCOLS=[['sec',['大題']],['no',['題號']],['type',['題型']],['sum',['題目摘要','摘要','題目']],['unit',['教材內容','單元']],['cog',['認知歷程','認知']],['know',['知識向度','知識']],['diff',['難度']],['score',['配分','分數']],['lit',['素養導向','素養']],['concept',['對應概念','概念']],['key',['正確答案','答案']]];
function parsePaperRows(text){
  text=text.replace(/^﻿/,'');const first=text.split('\n')[0];const d=first.includes('\t')?'\t':',';
  let rows=parseDelim(text,d);if(!rows.length)throw new Error('沒有讀到資料');
  let map=PCOLS.map((c,i)=>i);const h=rows[0].map(x=>x.trim());
  if(h.some(x=>x==='題號'||x==='大題'||x==='配分')){map=PCOLS.map(([k,names])=>h.findIndex(x=>names.includes(x)));rows=rows.slice(1)}

/* ================= 匯入匯出 ================= */
function csvCell(v){v=String(v??'');return /[",\n\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows,d=','){return rows.map(r=>r.map(csvCell).join(d)).join('\r\n')}
function download(name,text,mime,bom=true){
  const b=new Blob([(bom?'﻿':'')+text],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
}
function headerCols(c){const sub=c.subjects;return ['座號','姓名','特教身分','免列常態名次','考場調整措施','備註',...sub.map(k=>k+'_一段'),...sub.map(k=>k+'_二段')]}
function tplRows(){const c=C(),n=c.subjects.length;return [headerCols(c),[1,'學生甲','一般','否','','',...Array(n).fill(80),...Array(n).fill(85)],[2,'學生乙','資源班','是','延長作答時間20分鐘、試卷報讀','',...Array(n).fill(60),...Array(n).fill(66)]]}
function parseDelim(text,d){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function importText(text){
  text=text.replace(/^﻿/,'');const first=text.split('\n')[0],d=first.includes('\t')?'\t':',';
  const rows=parseDelim(text,d);if(rows.length<2)throw new Error('檔案沒有學生資料列');
  const h=rows[0].map(x=>x.trim()),idx=n=>h.indexOf(n);
  if(idx('姓名')<0)throw new Error('找不到「姓名」欄位');
  const subs=[];h.forEach(x=>{const m=x.match(/^(.+)_一段$/);if(m)subs.push(m[1])});
  if(!subs.length)throw new Error('找不到「科目_一段」欄位（例如：國文_一段）');
  const studs=rows.slice(1).map((r,i)=>{const g=n=>{const j=idx(n);return j<0?'':(r[j]??'').trim()};
    const type=TYPES[g('特教身分')]?g('特教身分'):'一般',ex=g('免列常態名次');
    const s={id:uid(),seat:Number(g('座號'))||i+1,name:g('姓名'),type,exempt:ex?/^(是|y|yes|1|true|v|✓)$/i.test(ex):EXEMPT_DEFAULT.includes(type),acc:splitList(g('考場調整措施')),note:g('備註'),s1:{},s2:{}};
    subs.forEach(k=>{const a=num(g(k+'_一段')),b=num(g(k+'_二段'));if(a!=null)s.s1[k]=a;if(b!=null)s.s2[k]=b});return s}).filter(s=>s.name);
  const c=C();if(c.students.length)snapshot('score','匯入名冊前自動備份');
  c.subjects=subs;c.students=studs;save();renderAll();toast(`已匯入 ${studs.length} 位學生到「${c.name}」`);
}
function autoSnapOnExport(kind,name){if(DB.settings.autoSnap)snapshot(kind,'匯出：'+name,true)}
function expCompare(){
  const c=C(),A=analyze(c),sub=c.subjects;
  const rows=[['座號','姓名','特教身分','一段平均','一段名次','二段平均','二段名次','平均差值','成長率(%)','名次異動',...sub.map(k=>k+'進退'),'備註']];
  A.forEach(o=>rows.push([o.s.seat,o.s.name,o.s.type,fmt(o.a1),o.k1,fmt(o.a2),o.k2,sgn(o.diff),o.rate==null?'':r1(o.rate),o.s.exempt?'免列':o.rc==null?'':o.rc,...sub.map(k=>{const a=num(o.s.s1[k]),b=num(o.s.s2[k]);return a!=null&&b!=null?b-a:''}),o.note]));
  download(`${c.name}_兩次段考對照分析.csv`,toCSV(rows),'text/csv;charset=utf-8');autoSnapOnExport('score','兩次段考對照 CSV');
}
function expSpecial(){
  const c=C(),rows=[['座號','姓名','特教身分','排名機制','考場調整措施','一段平均','二段平均','進步差值','備註']];
  analyze(c).filter(o=>isSpecial(o.s)).forEach(o=>rows.push([o.s.seat,o.s.name,o.s.type,o.s.exempt?'免列常態名次':'納入常態計分',o.s.acc.join('、'),fmt(o.a1),fmt(o.a2),sgn(o.diff),o.note]));
  download(`${c.name}_特殊需求學生名冊.csv`,toCSV(rows),'text/csv;charset=utf-8');autoSnapOnExport('score','特殊需求名冊 CSV');
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='classSel'){DB.cur=t.value;ui.subj=null;save();renderAll();return}
  if(t.id==='fmtSel'){ui.fmt=t.value;renderPrint()}
  else if(t.id==='rexSel'){ui.rexam=t.value;renderPrint()}
  else if(t.id==='pubChk'){ui.pub=t.checked;renderPrint()}
  else if(t.id==='paperSel'||t.id==='paperSel2'){DB.curPaper=t.value;save();t.id==='paperSel'?renderPaper():renderPrint()}
  else if(t.id==='hFilter'){ui.hfilter=t.value;renderAdmin()}
  else if(t.id==='autoSnap'){DB.settings.autoSnap=t.checked;save()}
  else if(t.id==='pRemark'){P().remark=t.value;save();renderPaper()}
  else if(t.dataset.pf){const p=P(),k=t.dataset.pf;if(k==='units'){p.units=splitList(t.value)}else p[k]=k==='total'?num(t.value):t.value;save();renderPaper()}
  else if(t.dataset.pi!=null)paperCell(t);
  else if(t.id==='remSel'){ui.remMis=t.value;renderPrint()}
  else if(t.id==='blankOk'){respOf(P(),C()).blankOk=t.checked;save();renderPaper()}
  else if(t.classList.contains('absChk')){const R=respOf(P(),C());if(t.checked)R.absent[t.dataset.s]=true;else delete R.absent[t.dataset.s];save();renderPaper()}
  else if(t.dataset.rm){const r=remedOf(P(),C(),t.dataset.rm);if(t.dataset.rs){if(t.value)r.st[t.dataset.rs]=t.value;else delete r.st[t.dataset.rs];save();renderPaper()}else{r[t.dataset.rf]=t.value;save()}}
  else if(t.id==='fileCsv'||t.id==='fileJson'||t.id==='filePaper'){
    const f=t.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{
      if(t.id==='fileCsv')importText(rd.result);
      else if(t.id==='filePaper'){const items=parsePaperRows(rd.result);if(!items.length)throw new Error('沒有題目');if(P().items.length)snapshot('paper','匯入前自動備份');addParsedItems(items,true)}
      else{DB=migrate(JSON.parse(rd.result));ensure();save();renderAll();toast('已還原備份')}
    }catch(err){toast('匯入失敗：'+err.message)}t.value=''};
    rd.readAsText(f,'utf-8');
  }
});
function paperCell(t){
  const p=P(),it=p.items[+t.dataset.pi];if(!it)return;const f=t.dataset.f;
  it[f]=f==='lit'?t.checked:f==='score'?num(t.value):f==='key'?t.value.trim().toUpperCase():t.value;
  if(f==='key'){t.value=it[f];if(Object.keys(it.mis).some(k=>(k===k.toUpperCase())!==!!it.key))it.mis={}}
  if(f==='score')updatePaperSum();saveSoon();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pi!=null&&t.type!=='checkbox'&&t.tagName==='INPUT'){paperCell(t);return}
  if(t.classList.contains('rc')){const p=P(),c=C(),R=respOf(p,c),it=p.items[+t.dataset.i],sid=t.dataset.s;R.data[sid]=R.data[sid]||{};
    const v=t.value.trim();if(v)R.data[sid][it.id]=v;else delete R.data[sid][it.id];
    const e=evalCell(it,v,R.blankOk);t.className='rc '+cellCls(e,v);const m=e.mis&&p.miscons.find(x=>x.id===e.mis);t.title=it.no+(m?'｜'+m.code+' '+m.name:'');
    const tot=p.items.reduce((a,x)=>a+evalCell(x,R.data[sid][x.id],R.blankOk).s,0);const rt=document.getElementById('rt-'+sid);if(rt)rt.innerHTML='<b>'+fmt(tot)+'</b>';saveSoon();return}
  if(!t.classList.contains('sc'))return;
  const c=C(),s=c.students.find(x=>x.id===t.dataset.id);if(!s)return;const v=t.value.trim();
  if(v==='')delete s[ui.exam][t.dataset.k];
  else{let n=Number(v);if(isNaN(n))return;n=Math.max(0,Math.min(100,n));s[ui.exam][t.dataset.k]=n}
  const cell=document.getElementById('avg-'+s.id);if(cell)cell.innerHTML='<b>'+fmt(avgOf(s,ui.exam,c))+'</b>';saveSoon();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  const t=e.target;
  if(t.classList&&t.classList.contains('rc')){const mv={Enter:[1,0],ArrowDown:[1,0],ArrowUp:[-1,0],ArrowRight:[0,1],ArrowLeft:[0,-1]}[e.key];if(mv){e.preventDefault();moveCell(t,mv[0],mv[1])}return}
  if(e.key!=='Enter'||!t.classList||!t.classList.contains('sc'))return;e.preventDefault();
  const all=[...document.querySelectorAll(`input.sc[data-k="${CSS.escape(t.dataset.k)}"]`)],nx=all[all.indexOf(t)+1];if(nx){nx.focus();nx.select()}
});

/* ---------- 全校教材庫與資料轉換 ---------- */
function normConcept(k){['name','subject','grade','code','goal','teach'].forEach(f=>k[f]=k[f]||'');k.pre=k.pre||[];k.resources=k.resources||[];k.ext=k.ext||[];if(!k.id)k.id=uid();return k}
function ensureLib(){
  DB.lib=DB.lib||{concepts:[],miscons:[]};DB.lib.concepts=DB.lib.concepts||[];DB.lib.miscons=DB.lib.miscons||[];DB.progress=DB.progress||{};
  DB.lib.miscons.forEach(m=>{m.steps=m.steps||[];m.practice=m.practice||[];m.check=m.check||[];['desc','cause','strategy','concept','name','subject','grade'].forEach(k=>m[k]=m[k]||'')});
  DB.lib.concepts.forEach(normConcept);
}
function conceptGet(name){return DB.lib.concepts.find(k=>k.name===name)}
function ensureConcept(name,subject,grade){if(!name||conceptGet(name))return;const L=CONLIB.find(x=>x.name===name);DB.lib.concepts.push(normConcept(L?{...clone(L),id:uid()}:{name,subject:subject||'',grade:grade||''}))}
function nextCodeG(){let n=0;DB.lib.miscons.forEach(m=>{const k=+((String(m.code).match(/\d+/)||[0])[0]);if(k>n)n=k});return 'M'+(n+1)}
function nextMisCode(){return nextCodeG()}
function misFromLib(p,lib){const L=MISLIB.find(x=>x.lib===lib);return L?{...clone(L),id:uid(),code:nextCodeG()}:null}
function mergeLegacy(p,legacy){
  const L=DB.lib.miscons,remap={};
  legacy.forEach(m=>{if(L.some(x=>x.id===m.id))return;const same=m.lib&&L.find(x=>x.lib===m.lib);if(same){remap[m.id]=same.id;return}
    const n=clone(m);if(L.some(x=>x.code===n.code))n.code=nextCodeG();n.subject=n.subject||p.subject||'';n.grade=n.grade||p.grade||'';L.push(n)});
  if(Object.keys(remap).length)p.items.forEach(it=>Object.keys(it.mis||{}).forEach(k=>{if(remap[it.mis[k]])it.mis[k]=remap[it.mis[k]]}));
}
function normPaper(p){
  if(!p)return p;
  const d=Object.getOwnPropertyDescriptor(p,'miscons');
  if(d&&!d.get){const legacy=d.value||[];delete p.miscons;
    if(DB&&DB.papers&&DB.papers.includes(p)){ensureLib();mergeLegacy(p,legacy)}else Object.defineProperty(p,'__legacy',{value:legacy,enumerable:false,configurable:true})}
  if(!Object.getOwnPropertyDescriptor(p,'miscons'))Object.defineProperty(p,'miscons',{enumerable:false,configurable:true,
    get(){const L=DB.lib.miscons;return p.__legacy?L.concat(p.__legacy.filter(m=>!L.some(x=>x.id===m.id))):L},set(v){DB.lib.miscons=v}});
  p.resp=p.resp||{};p.remed=p.remed||{};p.kind=p.kind||'段考';p.adate=p.adate||'';
  (p.items||[]).forEach(it=>{if(it.concept==null)it.concept='';if(it.key==null)it.key='';if(!it.mis||typeof it.mis!=='object')it.mis={}});
  return p;
}
function ensure(){
  ensureLib();
  (DB.papers||[]).forEach(p=>{normPaper(p);p.items.forEach(it=>ensureConcept(it.concept,p.subject,p.grade))});
  DB.lib.miscons.forEach(m=>ensureConcept(m.concept,m.subject,m.grade));
  if(!DB.classes.length){const c=blankClass('我的班級');DB.classes.push(c);DB.cur=c.id}
  DB.cur=C().id;if(DB.papers.length&&!DB.papers.find(p=>p.id===DB.curPaper))DB.curPaper=DB.papers[0].id;
}
function snapshot(kind,label,quiet){
  const obj=kind==='score'?C():P();if(!obj)return false;
  const data=clone(obj);
  if(kind==='paper'){const ids=new Set(obj.items.flatMap(it=>Object.values(it.mis)));data.miscons=clone(obj.miscons.filter(m=>ids.has(m.id)))}
  if(kind==='score'&&DB.progress[obj.id])data.__progress=clone(DB.progress[obj.id]);
  const last=DB.history.find(h=>h.kind===kind&&h.ref===obj.id);
  if(quiet&&last&&JSON.stringify(last.data)===JSON.stringify(data))return false;
  DB.history.unshift({id:uid(),time:new Date().toISOString(),kind,ref:obj.id,refName:kind==='score'?obj.name:obj.title,label:label||'手動存檔',data});
  if(DB.history.length>300)DB.history.length=300;
  save();return true;
}

/* ---------- 補救多輪 ---------- */
function remedOf(p,c,mid){
  p.remed[c.id]=p.remed[c.id]||{};const r=p.remed[c.id];if(!mid)return r;
  let g=r[mid];if(!g)g=r[mid]={rounds:[{date:'',note:'',strategy:'',st:{}}]};
  if(!g.rounds){g.rounds=[{date:g.date||'',note:g.note||'',strategy:'',st:g.st||{}}];delete g.date;delete g.note;delete g.st}
  g.rounds.forEach(x=>{x.st=x.st||{};x.note=x.note||'';x.date=x.date||'';x.strategy=x.strategy||''});return g;
}
const inRound=(g,i,sid)=>i===0||(g.rounds[i].members||[]).includes(sid);
function remedStatus(p,c,mid,sid){const g=remedOf(p,c,mid);for(let i=g.rounds.length-1;i>=0;i--){if(inRound(g,i,sid)&&(g.rounds[i].st[sid]||i===0))return g.rounds[i].st[sid]||''}return ''}
function remedRoundOf(p,c,mid,sid){const g=remedOf(p,c,mid);for(let i=g.rounds.length-1;i>=0;i--){if(inRound(g,i,sid))return i}return 0}

/* ---------- 跨評量證據彙整 ---------- */
function papersFor(c){
  return DB.papers.map((p,i)=>({p:normPaper(p),i})).filter(x=>{const R=x.p.resp[c.id];return R&&Object.keys(R.data||{}).length})
   .sort((a,b)=>(a.p.adate||'9999').localeCompare(b.p.adate||'9999')||a.i-b.i).map(x=>x.p);
}
function conceptDepth(name,seen){seen=seen||new Set();if(seen.has(name))return 0;seen.add(name);const k=conceptGet(name);if(!k||!k.pre.length)return 0;return 1+Math.max(...k.pre.map(x=>conceptDepth(x,seen)))}
let _ev=null,_evKey='';
function classEvidence(c){
  const key=c.id+'|'+JSON.stringify(DB.papers.map(p=>[p.id,p.adate,p.resp[c.id],p.remed[c.id],p.items.length]))+JSON.stringify(c.students.map(s=>s.id))+DB.lib.miscons.length;

const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
let _dl=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')_dl=await window.claude.use('downloads')}catch(e){}})();
function download(name,text,mime,bom=true){
  const data=(bom?'﻿':'')+text;
  if(_dl){_dl.save({filename:name,data}).then(r=>{if(r&&r.status==='saved')toast('已下載：'+name)}).catch(err=>{const c=err&&err.code;if(c==='declined')return;if(c==='rate_limited'){toast('請稍候再試一次');return}toast('這個頁面無法下載檔案（'+(c||'unavailable')+'），請改用 html 檔版本')});return}
  const b=new Blob([data],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
  if(IN_FRAME)setTimeout(()=>toast('若沒有開始下載，請改用 html 檔版本'),900);
}
function printFallback(){
  const wrap=document.querySelector('#p-print .docwrap');if(!wrap){toast('沒有可列印的文件');return}
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');

body{background:#e3e6ee}.pbar-hint{max-width:780px;margin:12px auto;font-size:14px;color:#444}@media print{.pbar-hint{display:none}}</style></head>
<body onload="setTimeout(function(){window.print()},300)"><div class="pbar-hint">列印視窗沒有自動出現時，請按 Ctrl＋P（Mac：⌘＋P），紙張選 A4；要存成 PDF，目的地選「另存為 PDF」。</div><main><div class="docwrap">${wrap.innerHTML}</div></main></body></html>`;
  download(title.replace(/[\\/:*?"<>|]/g,'_')+'.html',html,'text/html;charset=utf-8',false);

function normPaper(p){
  if(!p)return p;
  const d=Object.getOwnPropertyDescriptor(p,'miscons');
  if(d&&!d.get){const legacy=d.value||[];delete p.miscons;
    if(DB&&DB.papers&&DB.papers.includes(p)){ensureLib();mergeLegacy(p,legacy)}else Object.defineProperty(p,'__legacy',{value:legacy,enumerable:false,configurable:true})}
  if(!Object.getOwnPropertyDescriptor(p,'miscons'))Object.defineProperty(p,'miscons',{enumerable:false,configurable:true,
    get(){const L=DB.lib.miscons;return p.__legacy?L.concat(p.__legacy.filter(m=>!L.some(x=>x.id===m.id))):L},set(v){DB.lib.miscons=v}});
  p.resp=p.resp||{};p.remed=p.remed||{};p.kind=p.kind||'段考';p.adate=p.adate||'';
  (p.items||[]).forEach(it=>{if(it.concept==null)it.concept='';if(it.key==null)it.key='';if(!it.mis||typeof it.mis!=='object')it.mis={};
    if(it.ans==null)it.ans='';if(!Array.isArray(it.ansAlt))it.ansAlt=[];if(!it.wrong||typeof it.wrong!=='object')it.wrong={};if(!Array.isArray(it.rubric))it.rubric=[]});
  return p;
}
function respOf(p,c){p.resp[c.id]=p.resp[c.id]||{blankOk:true,data:{},absent:{}};const R=p.resp[c.id];
  R.data=R.data||{};R.absent=R.absent||{};R.raw=R.raw||{};R.pending=R.pending||{};if(R.blankOk==null)R.blankOk=true;return R}
const normAns=s=>String(s??'').replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xfee0)).replace(/　/g,' ').replace(/\s+/g,'').replace(/[。．.]$/,'').toLowerCase();
const accepted=it=>String(it.ans||'').split(/[／/|｜]/).concat(it.ansAlt||[]).map(normAns).filter(Boolean);
const rubricOf=it=>(it.rubric||[]).map(l=>{const m=String(l).match(/^\s*(\d+(?:\.\d+)?)\s*[分]?\s*[:：、.\-]?\s*(.*)$/);return m?{s:+m[1],d:m[2]}:null}).filter(Boolean);
const isOpen=it=>OPEN_TYPES.includes(it.type)||rubricOf(it).length>0;
function pendingCount(R){return Object.values(R.pending||{}).reduce((a,g)=>a+Object.values(g).reduce((b,x)=>b+x.sids.length,0),0)}
function parseVal(v){const m=String(v||'').toLowerCase().match(/^(\d+(?:\.\d+)?)?([a-h])?$/);return m?{s:m[1]!=null?+m[1]:null,c:m[2]||null}:{s:null,c:null}}

function parseQuick(p,text){
  const out={},bad=[];
  String(text||'').split(/[\s,，、;；]+/).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(#?\d+|[^:：=]+?)(?:[:：=](.+))?$/);if(!m){bad.push(tok);return}
    let it=null,id=m[1];
    if(id[0]==='#')it=p.items[+id.slice(1)-1];else it=p.items.find(x=>x.no===id)||(/^\d+$/.test(id)&&!p.items.some(x=>/^\d+$/.test(x.no))?p.items[+id-1]:null);
    if(!it){bad.push(tok);return}
    let v=(m[2]||'x').trim();v=it.key?v.toUpperCase():v.toLowerCase();
    if(!it.key&&v!=='x'&&!/^(\d+(?:\.\d+)?)?([a-h])?$/.test(v)){bad.push(tok);return}
    if(it.key&&v!=='X'&&!/^[A-E]$/.test(v)){bad.push(tok);return}
    out[it.id]=v==='X'?'x':v});
  return{out,bad};
}

function importAnswers(text){
  const p=P(),c=C(),R=respOf(p,c);text=String(text||'').replace(/^﻿/,'');
  const d=text.split('\n')[0].includes('\t')?'\t':',',rows=parseDelim(text,d);if(rows.length<2)throw new Error('至少要有標題列和一位學生');
  const h=rows[0].map(x=>x.trim()),seatC=h.findIndex(x=>/座號|號碼|座次|seat/i.test(x)),nameC=h.findIndex(x=>/姓名|名字|學生|name/i.test(x));
  if(seatC<0&&nameC<0)throw new Error('找不到「座號」或「姓名」欄');
  const esc2=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let col=p.items.map(it=>h.findIndex(x=>x===it.no||new RegExp('^\\s*'+esc2(it.no)+'(?![\\d(（])').test(x)));
  const st=parseInt(ui.impStart,10);

  rows.slice(1).forEach(r=>{
    let s=null;if(seatC>=0)s=c.students.find(x=>String(x.seat)===String(r[seatC]).trim().replace(/^0+/,''));
    if(!s&&nameC>=0)s=c.students.find(x=>x.name===String(r[nameC]).trim());
    if(!s){if(r.some(x=>x.trim()))unknown.push(r[seatC>=0?seatC:nameC]);return}
    n++;const prevD=R.data[s.id]||{},prevR=R.raw[s.id]||{};R.data[s.id]={};R.raw[s.id]={};delete R.absent[s.id];
    p.items.forEach((it,i)=>{
      const wasPend=Object.values(R.pending[it.id]||{}).some(g=>g.sids.includes(s.id));
      Object.values(R.pending[it.id]||{}).forEach(g=>{g.sids=g.sids.filter(x=>x!==s.id)});
      const raw=String(r[col[i]]??'').trim();if(raw)R.raw[s.id][it.id]=raw;
      if(raw&&raw===prevR[it.id]&&!wasPend){if(prevD[it.id])R.data[s.id][it.id]=prevD[it.id];auto++;return}
      if(!raw){R.data[s.id][it.id]='x';auto++;return}
      if(it.key){const m=raw.match(/^\s*[（(]?\s*([A-Ea-e])(?![A-Za-z])/);if(m){const L=m[1].toUpperCase();if(L!==it.key.toUpperCase())R.data[s.id][it.id]=L;auto++;return}}
      else{const k=normAns(raw);if(accepted(it).includes(k)){auto++;return}if(it.wrong[k]!=null){R.data[s.id][it.id]=it.wrong[k];auto++;return}}
      const k=normAns(raw)||'(空白)';R.pending[it.id]=R.pending[it.id]||{};const g=R.pending[it.id][k]=R.pending[it.id][k]||{raw,sids:[]};g.sids.push(s.id);R.data[s.id][it.id]='x';pend++;
    });
  });
  Object.keys(R.pending).forEach(id=>{Object.keys(R.pending[id]).forEach(k=>{if(!R.pending[id][k].sids.length)delete R.pending[id][k]});if(!Object.keys(R.pending[id]).length)delete R.pending[id]});
  save();ui.respMode='import';renderRespTab();
  toast(`已匯入 ${n} 位學生：自動判讀 ${auto} 筆，待老師判斷 ${pend} 筆${unknown.length?`；找不到的學生：${unknown.slice(0,5).join('、')}`:''}`);
}
function judgePending(itId,k,v){
  const p=P(),c=C(),R=respOf(p,c),it=p.items.find(x=>x.id===itId),g=R.pending[itId]&&R.pending[itId][k];if(!it||!g)return;

      f.addEventListener('change',()=>{const x=f.files[0];if(!x)return;const rd=new FileReader();rd.onload=()=>{try{importAnswers(rd.result)}catch(err){toast('無法匯入：'+err.message)}f.value=''};rd.readAsText(x,'utf-8')})}f.click()},
    pjudge:()=>judgePending(b.dataset.i,b.dataset.k,b.dataset.v),
    delwrong:()=>{e.preventDefault();const it=P().items[ui.itemIdx];collectItemMis();delete it.wrong[b.dataset.k];save();openItemMis(ui.itemIdx)},
    delalt:()=>{e.preventDefault();const it=P().items[ui.itemIdx];collectItemMis();it.ansAlt=it.ansAlt.filter(x=>x!==b.dataset.k);save();openItemMis(ui.itemIdx)},
  };
  if(H[a]){e.stopPropagation();e.stopImmediatePropagation();H[a]()}
},true);
document.addEventListener('change',e=>{
  const t=e.target;let hit=true;
  if(t.id==='riSel'){ui.respItem=+t.value;renderRespTab()}
  else if(t.classList&&t.classList.contains('qe')){const p=P(),c=C(),R=respOf(p,c),{out,bad}=parseQuick(p,t.value);R.data[t.dataset.s]=out;save();
    const cell=document.getElementById('qp-'+t.dataset.s);if(cell)cell.innerHTML=quickChips(p,out)+(bad.length?`<span class="down">　找不到這些題號：${esc(bad.join(' '))}（題號要和題目清單一致，例如 七-2(1)）</span>`:'');
    const tot=p.items.reduce((a,x)=>a+evalCell(x,out[x.id],R.blankOk).s,0);const td=t.closest('tr').lastElementChild;if(td)td.innerHTML='<b>'+fmt(tot)+'</b>'}
  else if(t.id==='impStart'){ui.impStart=t.value}
  else if(t.id==='remember'){ui.remember=t.checked}
  else if(t.id==='blankOk'&&ui.tab==='resp'){respOf(P(),C()).blankOk=t.checked;save();renderRespTab()}
  else if(t.classList&&t.classList.contains('absChk')&&ui.tab==='resp'){const R=respOf(P(),C());if(t.checked)R.absent[t.dataset.s]=true;else delete R.absent[t.dataset.s];save();renderRespTab()}
  else hit=false;
  if(hit){e.stopPropagation();e.stopImmediatePropagation()}
},true);
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('qe')&&e.key==='Enter'){e.preventDefault();const all=[...document.querySelectorAll('input.qe:not(:disabled)')],nx=all[all.indexOf(t)+1];t.dispatchEvent(new Event('change',{bubbles:true}));if(nx){nx.focus();nx.select()}return}
  if(ui.tab==='resp'&&ui.respMode==='item'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)&&!$('#modalBg').classList.contains('on')){
    if(e.key==='ArrowRight'&&ui.respItem<P().items.length-1){ui.respItem++;renderRespTab()}else if(e.key==='ArrowLeft'&&ui.respItem>0){ui.respItem--;renderRespTab()}}
},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="resptpl"]');if(!b||ui.respMode!=='import')return;e.stopPropagation();e.stopImmediatePropagation();
  const p=P(),c=C();download(`${c.name}_${p.title}_作答範本.csv`,toCSV([['座號','姓名',...p.items.map(it=>it.no)],...sortedS(c).map(s=>[s.seat,s.name,...p.items.map(()=>'')])]),'text/csv;charset=utf-8');
},true);

load();ensure();renderHeader();go('home');webNote();
</script>
